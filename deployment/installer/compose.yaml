name: ${COMPOSE_PROJECT_NAME:-yodamen}
services:
  app:
    build: .
    image: yodamen-local:${APP_VERSION:?Run install.sh to create installation configuration}
    env_file: runtime.env
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - uploads:/var/www/html/storage/app
      - yodamen_app_state:/var/www/html/storage/framework
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yodamen_trial
      MYSQL_USER: yodamen
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run install.sh first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run install.sh first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
volumes:
  database:
  uploads:
  yodamen_app_state:
